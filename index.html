<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Flip</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f4f1ea;
    color: #2b2b2b;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden;
  }
  h1 { font-size: clamp(1.2rem, 5vw, 1.8rem); font-weight: 500; margin: 32px 16px 0; text-align: center; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: -40px; }
  .scene {
    --size: min(220px, 55vw);
    perspective: 900px; width: var(--size); height: var(--size);
    cursor: pointer; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .coin { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; }
  .face {
    position: absolute; inset: 0; border-radius: 50%;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--size) * .25); font-weight: 700; font-family: Georgia, serif;
    border: 7px solid transparent;
    background:
      radial-gradient(circle at 35% 30%, #ffffff, #d4d8dc 55%, #a9aeb4) padding-box,
      repeating-conic-gradient(#8e949a 0deg 3deg, #eef0f2 3deg 6deg) border-box;
    box-shadow: inset 0 0 0 3px #b9bec4, inset 0 0 30px rgba(60,70,80,.35), 0 4px 10px rgba(0,0,0,.3);
    color: #6b7178; text-shadow: 1px 1px 0 #fff;
  }
  .tails { transform: rotateX(180deg); }
  .shadow {
    width: min(150px, 38vw); height: 18px; border-radius: 50%; background: rgba(0,0,0,.22);
    filter: blur(6px); margin-top: 40px;
  }
  #result { margin-top: 24px; font-size: 2.2rem; font-weight: 600; min-height: 3rem; text-transform: capitalize; }
</style>
</head>
<body>
  <h1>Click on the coin to flip it.</h1>
  <main>
    <div class="scene" id="scene" aria-label="Coin">
      <div class="coin" id="coin">
        <div class="face heads">H</div>
        <div class="face tails">T</div>
      </div>
    </div>
    <div class="shadow" id="shadow"></div>
    <div id="result" aria-live="polite"></div>
  </main>

<script>
  // Probability of heads is read from config.json (same folder) on every page load.
  let pHeads = 0.85; // fallback if config.json can't be loaded
  fetch("config.json", { cache: "no-store" })
    .then(r => r.json())
    .then(c => { if (c.pHeads >= 0 && c.pHeads <= 1) pHeads = c.pHeads; })
    .catch(() => {});

  const coin = document.getElementById("coin");
  const scene = document.getElementById("scene");
  const shadow = document.getElementById("shadow");
  const result = document.getElementById("result");
  let rotation = 0;      // current rotateX in degrees (multiple of 180)
  let flipping = false;

  function flip() {
    if (flipping) return;
    flipping = true;
    result.textContent = "";
    const heads = Math.random() < pHeads;
    // heads = multiple of 360, tails = odd multiple of 180
    const spins = 5 + Math.floor(Math.random() * 3);
    let target = rotation + spins * 360;
    const isTails = Math.round(target / 180) % 2 !== 0;
    if (!heads !== isTails) target += 180;
    const start = rotation;
    const dur = 1800;
    const jump = Math.min(200, window.innerHeight * 0.25);

    coin.animate([
      { transform: `translateY(0) rotateX(${start}deg)` },
      { transform: `translateY(${-jump}px) rotateX(${(start + target) / 2}deg)`, offset: 0.5, easing: "ease-in" },
      { transform: `translateY(0) rotateX(${target}deg)` }
    ], { duration: dur, easing: "ease-out", fill: "forwards" }).finished.then(() => {
      rotation = target;
      coin.getAnimations().forEach(a => a.cancel());
      coin.style.transform = `rotateX(${rotation}deg)`;
      result.textContent = heads ? "heads" : "tails";
      flipping = false;
    });
    shadow.animate([
      { transform: "scale(1)", opacity: 1 },
      { transform: "scale(.5)", opacity: .4, offset: 0.5 },
      { transform: "scale(1)", opacity: 1 }
    ], { duration: dur });
  }

  // Pointer events cover mouse, touch, and pen.
  scene.addEventListener("pointerup", flip);
  scene.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") flip(); });
</script>
</body>
</html>
